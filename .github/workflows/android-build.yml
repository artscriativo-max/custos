name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Dependencies
        run: |
          cd controle-producao-custos
          npm install

      - name: Build Web Project
        run: |
          cd controle-producao-custos
          npm run build

      - name: Sync Capacitor
        run: |
          cd controle-producao-custos
          npx cap add android
          npx cap sync

      - name: Build Android App (APK)
        run: |
          cd controle-producao-custos/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: controle-producao-custos/android/app/build/outputs/apk/debug/app-debug.apk

