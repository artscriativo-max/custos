<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Catálogo - Copelli</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="editor-container">
        <!-- Painel de Controle (Esquerda) -->
        <aside class="control-panel no-print">
            <header class="panel-header">
                <h2>Catálogo Copelli</h2>
                <p>Altere preços ou adicione produtos. A folha atualiza em tempo real.</p>
            </header>

            <form id="editor-form">
                <!-- Seção 0: Logo e Título -->
                <section class="form-section">
                    <h3 class="section-title">Cabeçalho</h3>
                    <div class="form-group">
                        <label for="titulo-catalogo">Título do Catálogo</label>
                        <input type="text" id="titulo-catalogo" value="Catálogo de Produtos - Copelli Delícias Caseiras" required>
                    </div>
                    <div class="form-group">
                        <label for="logo-upload">Carregar Logo (opcional)</label>
                        <input type="file" id="logo-upload" accept="image/*">
                    </div>
                    <div class="form-group" style="margin-top: 1rem; margin-bottom: 0;">
                        <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; text-transform: none; font-size: 0.85rem; color: var(--editor-text); font-weight: 500; letter-spacing: 0;">
                            <input type="checkbox" id="chk-ordem-alfabetica" checked style="width: 17px; height: 17px; accent-color: #b33939; cursor: pointer;">
                            <span>🔤 Organizar produtos automaticamente em ordem alfabética (A-Z)</span>
                        </label>
                    </div>
                </section>

                <!-- Categorias Geradas Dinamicamente pelo JS -->
                <div id="categorias-container">
                    <!-- Acordeões de categorias entrarão aqui -->
                </div>
            </form>

            <footer class="panel-footer" style="display: flex; flex-direction: column; gap: 0.5rem; padding: 1.25rem;">
                <div style="display: flex; gap: 0.5rem; width: 100%;">
                    <button type="button" class="btn btn-secondary" id="btn-salvar" style="flex: 1;">💾 Salvar</button>
                    <button type="button" class="btn btn-primary" id="btn-imprimir" style="flex: 1.5;">🖨️ Imprimir PDF</button>
                </div>
                <div style="display: flex; gap: 0.5rem; width: 100%;">
                    <button type="button" class="btn btn-secondary btn-sm" id="btn-exportar-json" style="flex: 1; font-size: 0.75rem;">📥 Exportar Backup (JSON)</button>
                    <button type="button" class="btn btn-secondary btn-sm" id="btn-importar-trigger" style="flex: 1; font-size: 0.75rem;">📤 Importar Backup (JSON)</button>
                    <input type="file" id="input-importar-json" accept=".json" style="display: none;">
                </div>
                <button type="button" class="btn btn-secondary btn-sm" id="btn-gerar-json-codigo" style="width: 100%; font-size: 0.75rem; background: rgba(255,255,255,0.1);">📋 Copiar Código dos Dados para o ZIP</button>
                <button type="button" class="btn btn-secondary btn-sm" id="btn-reset" style="width: 100%; opacity: 0.7; font-size: 0.75rem; margin-top: 0.2rem;">🔄 Restaurar Tabela Padrão</button>
            </footer>
        </aside>

        <!-- Visualização do Catálogo (Direita) -->
        <main class="preview-panel">
            <div class="a4-sheet" id="catalogo-preview">
                <!-- Conteúdo renderizado em tempo real -->
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
